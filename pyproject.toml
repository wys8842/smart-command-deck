[project]
name = "smart-command-deck"
version = "0.1.0"
description = "智能推演指挥台：回合制多智能体决策推演平台（agentorchestra 为第三方库）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # agentorchestra（Symphony）以第三方库方式接入，安装方式见 README §安装：
    #   pip install -e ../agentorchestra      （开发期，同级目录）
    #   pip install "agentorchestra @ git+https://github.com/wys8842/agentorchestra-v0.2.0.git"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "uvicorn>=0.30",
    "fastapi>=0.110",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
